<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abdalla Nadir — AI, Software & Data Portfolio</title>
  <meta name="description" content="Portfolio of Abdalla Nadir, a Computer Science (AI) student passionate about machine learning, software engineering, data analysis, and AI engineering."/>
  <meta name="theme-color" content="#0e0804"/>

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>

  <!-- Open Graph (LinkedIn, WhatsApp, Facebook…) -->
  <meta property="og:type" content="website"/>
  <meta property="og:url" content="https://abdulla-cc.github.io/abdalla-nadir-portfolio/"/>
  <meta property="og:title" content="Abdalla Nadir — AI, Software & Data Portfolio"/>
  <meta property="og:description" content="Full-stack software, machine learning, AI engineering, and data analysis projects by Abdalla Nadir."/>
  <meta property="og:image" content="https://abdulla-cc.github.io/abdalla-nadir-portfolio/og-image-v2.png"/>
  <meta property="og:image:width" content="1200"/>
  <meta property="og:image:height" content="630"/>

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="Abdalla Nadir — AI, Software & Data Portfolio"/>
  <meta name="twitter:description" content="Full-stack software, machine learning, AI engineering, and data analysis projects."/>
  <meta name="twitter:image" content="https://abdulla-cc.github.io/abdalla-nadir-portfolio/og-image-v2.png"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <script>
    // Set theme as early as possible to avoid a flash
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
